name: Montacode APK

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: montacode-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test preview APK
        if: github.ref_type == 'branch'
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload preview APK
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v7
        with:
          name: Montacode-android-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*$/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must match app version v$version"
            exit 1
          fi

      - name: Build and test release APK
        if: github.ref_type == 'tag'
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Sign and verify universal APK
        if: github.ref_type == 'tag'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STARACT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STARACT_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Set STARACT_KEYSTORE_BASE64 and STARACT_KEYSTORE_PASSWORD before publishing."
            exit 1
          fi
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work/staract.p12"
          unset KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned=app/build/outputs/apk/release/app-universal-release-unsigned.apk
          mkdir -p release
          apk="Montacode-for-Android-${GITHUB_REF_NAME}.apk"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$work/aligned.apk"
          "$tools/apksigner" sign --ks "$work/staract.p12" --ks-type PKCS12 \
            --ks-key-alias staract --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD --out "release/$apk" "$work/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "release/$apk"
          "$tools/zipalign" -c -P 16 4 "release/$apk"
          (cd release && sha256sum "$apk" > "${apk}.sha256")

      - name: Upload verified release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Montacode-signed-release
          path: release/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Montacode-signed-release
          path: release

      - name: Publish APK on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          apk="Montacode-for-Android-${GITHUB_REF_NAME}.apk"
          sha256sum --check "${apk}.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "${apk}.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Montacode $GITHUB_REF_NAME" \
            --notes "Montacode Android release. See the source repository for setup and upstream attribution."
